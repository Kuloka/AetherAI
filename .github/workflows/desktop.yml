name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:security

      - name: Check model selection and provider interface (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox tests/model-mode-smoke.cjs
      - name: Check model selection and provider interface
        if: runner.os != 'Linux'
        run: npx electron tests/model-mode-smoke.cjs

      - name: Check formulas and logo animation (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox tests/math-logo-smoke.cjs
      - name: Check formulas and logo animation
        if: runner.os != 'Linux'
        run: npx electron tests/math-logo-smoke.cjs

      - name: Check chat visual preferences
        if: runner.os == 'Windows'
        run: npx electron tests/style-visual-smoke.cjs

      - name: Build native packages
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Check packaged file boundaries
        run: node tests/package-security.cjs

      - name: Smoke test packaged application (Linux)
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox tests/native-shell-smoke.cjs

      - name: Smoke test packaged application
        timeout-minutes: 2
        if: runner.os != 'Linux'
        run: npx electron tests/native-shell-smoke.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: AetherAI-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Replace legacy release files
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner, repo, tag: context.ref.replace('refs/tags/', '')
              }));
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            for (const asset of release.assets.filter(asset => asset.name.includes('1.19.0'))) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, prerelease: false, draft: false
            });

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AetherAI ${{ github.ref_name }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          prerelease: false
          overwrite_files: true
          files: |
            release-files/**/*.exe
            release-files/**/*.AppImage
            release-files/**/*.deb
            release-files/**/*.dmg
